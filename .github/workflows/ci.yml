name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose. `packageManager` in package.json is
      # the one that binds locally, and declaring it twice is not redundancy —
      # the action refuses to start when the two disagree, which is how every
      # run since the pnpm bump has failed before reaching a single check.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage thresholds in packages/core fail the build if any booking
      # transition loses test coverage.
      - name: Test
        run: pnpm test:coverage
