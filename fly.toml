# reservAI agent service — Fly.io
#
# Lives at the repository root because the build context has to be the whole
# workspace: the service bundles @reservai/* from source. Deploy with
# `fly deploy` from here.
#
# Singapore, not because it is closest to Dubai — Frankfurt is marginally
# closer — but because it is closest to the database.
#
# Supabase runs in Mumbai. A single booking request makes many database round
# trips and only one round trip to the user, so the distance that dominates is
# service-to-database, not user-to-service. Singapore to Mumbai is about half
# the distance of Frankfurt to Mumbai.
#
# Fly's Mumbai region (bom) is deprecated and refuses new machines, so
# co-locating with Supabase exactly is not an option.

app = "reserv-agent"
primary_region = "sin"

[build]
  dockerfile = "apps/agent-service/Dockerfile"

[env]
  AGENT_SERVICE_PORT = "3030"
  NODE_ENV = "production"
  RESERVAI_ENV = "production"

[http_service]
  internal_port = 3030
  force_https = true
  # The scheduler must keep running, so the machine never stops. A stopped
  # machine means no reminders and no SLA escalation until the next request
  # happens to wake it.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
